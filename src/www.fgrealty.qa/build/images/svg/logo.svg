<svg xmlns="http://www.w3.org/2000/svg" width="260" height="52" fill="none" viewBox="0 0 260 52">
  <defs>
    <linearGradient id="g_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E8CE7A"/>
      <stop offset="25%"  stop-color="#D4A84B"/>
      <stop offset="55%"  stop-color="#F7EAB0"/>
      <stop offset="80%"  stop-color="#C8973A"/>
      <stop offset="100%" stop-color="#E0BC6A"/>
    </linearGradient>
    <linearGradient id="g_gold2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F5E9A8"/>
      <stop offset="50%"  stop-color="#C8973A"/>
      <stop offset="100%" stop-color="#F0D98A"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════ -->
  <!--  MANDALA EMBLEM — centered at (26, 26)      -->
  <!-- ═══════════════════════════════════════════ -->
  <g transform="translate(26,26)">
    <!-- Outer decorative ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#g_gold)" stroke-width="0.9" opacity="0.7"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="16.5" fill="none" stroke="url(#g_gold)" stroke-width="0.6" opacity="0.5"/>

    <!-- 8 radial petal spokes -->
    <g stroke="url(#g_gold)" stroke-width="0.7" opacity="0.8">
      <line x1="0" y1="-22" x2="0" y2="-10"/>
      <line x1="0" y1="22"  x2="0" y2="10"/>
      <line x1="-22" y1="0" x2="-10" y2="0"/>
      <line x1="22"  y1="0" x2="10"  y2="0"/>
      <line x1="-15.6" y1="-15.6" x2="-7" y2="-7"/>
      <line x1="15.6"  y1="-15.6" x2="7"  y2="-7"/>
      <line x1="-15.6" y1="15.6"  x2="-7" y2="7"/>
      <line x1="15.6"  y1="15.6"  x2="7"  y2="7"/>
    </g>

    <!-- 8 petal diamonds at outer ring -->
    <g fill="url(#g_gold)" opacity="0.9">
      <polygon points="0,-22  2,-18  0,-14  -2,-18" />
      <polygon points="0,22   2,18   0,14   -2,18" />
      <polygon points="-22,0  -18,2  -14,0  -18,-2" />
      <polygon points="22,0   18,2   14,0   18,-2" />
      <polygon points="-15.6,-15.6  -12.7,-13.4  -10,-10  -13.4,-12.7" />
      <polygon points="15.6,-15.6   12.7,-13.4   10,-10   13.4,-12.7" />
      <polygon points="-15.6,15.6   -12.7,13.4   -10,10   -13.4,12.7" />
      <polygon points="15.6,15.6    12.7,13.4    10,10    13.4,12.7" />
    </g>

    <!-- Central 4-petal flower -->
    <g fill="url(#g_gold2)">
      <!-- Top petal -->
      <ellipse cx="0" cy="-5.5" rx="2.8" ry="5.5" opacity="0.95"/>
      <!-- Bottom petal -->
      <ellipse cx="0" cy="5.5"  rx="2.8" ry="5.5" opacity="0.95"/>
      <!-- Left petal -->
      <ellipse cx="-5.5" cy="0" rx="5.5" ry="2.8" opacity="0.95"/>
      <!-- Right petal -->
      <ellipse cx="5.5"  cy="0" rx="5.5" ry="2.8" opacity="0.95"/>
    </g>

    <!-- Center jewel -->
    <circle cx="0" cy="0" r="3.5" fill="url(#g_gold)"/>
    <circle cx="0" cy="0" r="1.8" fill="#FFF9E6"/>

    <!-- Tiny dots at 45° ring intersections -->
    <g fill="url(#g_gold)" opacity="0.85">
      <circle cx="0"  cy="-16.5" r="1.1"/>
      <circle cx="0"  cy="16.5"  r="1.1"/>
      <circle cx="-16.5" cy="0"  r="1.1"/>
      <circle cx="16.5"  cy="0"  r="1.1"/>
      <circle cx="-11.7" cy="-11.7" r="1.0"/>
      <circle cx="11.7"  cy="-11.7" r="1.0"/>
      <circle cx="-11.7" cy="11.7"  r="1.0"/>
      <circle cx="11.7"  cy="11.7"  r="1.0"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!--  SEPARATOR LINE                            -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="56" y1="10" x2="56" y2="42" stroke="url(#g_gold)" stroke-width="0.8" opacity="0.55"/>

  <!-- ═══════════════════════════════════════════ -->
  <!--  TYPOGRAPHY                                -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- "PRIME VIEW" — large, refined serif-style uppercase -->
  <text
    x="65" y="28"
    font-family="'Optima','Segoe UI','Georgia',serif"
    font-size="19"
    font-weight="700"
    letter-spacing="3.5"
    fill="url(#g_gold)">PRIME VIEW</text>

  <!-- "REAL ESTATE" — smaller, spaced tracking, white/cream -->
  <text
    x="65.5" y="42"
    font-family="'Optima','Segoe UI','Tahoma',sans-serif"
    font-size="9.5"
    font-weight="500"
    letter-spacing="5.8"
    fill="#E8E0CC"
    opacity="0.92">REAL ESTATE</text>
</svg>